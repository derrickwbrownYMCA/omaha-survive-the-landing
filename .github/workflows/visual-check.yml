name: Soldier visual checks
on:
  pull_request:
  workflow_dispatch:

# Only reads source. No deployment, PR comments, secrets, or checkout credentials.
permissions:
  contents: read

jobs:
  capture:
    name: Capture ${{ matrix.source }} · ${{ matrix.screen }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        screen: [desktop, touch]
        source: ${{ fromJSON(github.event_name == 'pull_request' && '["base","head"]' || '["pages"]') }}
    steps:
      - name: Check out the test harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness
          persist-credentials: false
      - name: Check out the revision to serve or verify
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.source == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha || github.sha }}
          path: subject
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install the locked browser driver and its matching Chromium
        working-directory: harness/tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium --only-shell
      - name: Capture actual game frames
        env:
          SCREEN: ${{ matrix.screen }}
          SOURCE: ${{ matrix.source }}
        run: |
          export SUBJECT="$PWD/subject" OUTPUT="$PWD/evidence" SUBJECT_SHA="$(git -C subject rev-parse HEAD)"
          if [[ "$SOURCE" = pages ]]; then
            export GAME_URL='https://derrickwbrownymca.github.io/omaha-survive-the-landing/'
          else
            python3 -m http.server 4173 --bind 127.0.0.1 --directory subject > "$RUNNER_TEMP/game-server.log" 2>&1 &
            trap 'kill "$!" 2>/dev/null || true' EXIT
            export GAME_URL='http://127.0.0.1:4173/'
            curl --retry 10 --retry-connrefused --retry-delay 1 -fsS "$GAME_URL" -o /dev/null
          fi
          if [[ "$SOURCE" = head && "$SCREEN" = desktop ]]; then
            node --test harness/tests/*.test.mjs
            GAME_URL="${GAME_URL%/}/campaign/" OUTPUT="$OUTPUT/campaign" node harness/tests/campaign-browser.mjs
          fi
          node harness/tests/visual.mjs
          if [[ "$SOURCE" = pages ]]; then
            OUTPUT="$OUTPUT/wall-route" node harness/tests/wall-route.mjs
          fi
      - name: Preserve frames and trace, including partial results on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soldier-${{ matrix.source }}-${{ matrix.screen }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
